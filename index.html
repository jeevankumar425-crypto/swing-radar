<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--card:#f6f8f6;color-scheme:light;--ink:#14211c;--mut:#5d6b64;--line:#dde3dd;--acc:#0e6b5c;--accbg:#dff0ea;--up:#1b7f4b;--dn:#b3372f;--dnbg:#fbe9e7;--warn:#8a5a0b;--warnbg:#fbf0d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700}
h2{font-size:16px;margin:20px 0 8px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.tap{width:100%;text-align:left;display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.alert{background:var(--warnbg);border-color:var(--warn)}
.alert b{color:var(--warn)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.d{background:var(--dn);border-color:var(--dn);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:8px;font-weight:500;color:var(--mut);border-radius:10px}
nav button.on{color:var(--acc);background:var(--accbg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.grid b{display:block;font-size:16px}
svg{width:100%;height:auto;display:block}
label.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
input[type=number]{width:96px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:right}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
.note{background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script>
var D={INFY:{n:'Infosys',p:1402,v:1482},RELIANCE:{n:'Reliance Industries',p:1322,v:1315},
TATASTEEL:{n:'Tata Steel',p:168.4,v:166.9,t:'s',pat:'Bull flag breakout',sc:86,sl:161.2,tg:182,why:'Price broke above a tight flag on rising volume. Stop sits under the flag low.',nw:'Sample: steel demand outlook upgraded by analysts'},
SBIN:{n:'State Bank of India',p:812,v:809,t:'s',pat:'Pullback to 50-day average',sc:82,sl:785,tg:868,why:'Uptrend intact; price bounced off its 50-day average with momentum turning up.',nw:'Sample: loan growth steady in latest update'},
BHARTIARTL:{n:'Bharti Airtel',p:1655,v:1641,t:'s',pat:'Base breakout, volume surge',sc:79,sl:1598,tg:1760,why:'Cleared a 6-week base with volume well above average.',nw:'Sample: tariff revision chatter in sector news'},
ITC:{n:'ITC',p:421,v:420,t:'s',pat:'Double bottom neckline',sc:74,sl:408,tg:447,why:'Two equal lows and now testing the neckline. Needs a close above to confirm.',nw:'Sample: no major company news this week'},
LT:{n:'Larsen & Toubro',p:3590,v:3571,t:'s',pat:'Higher lows, RSI turning up',sc:71,sl:3470,tg:3830,why:'Series of higher lows; RSI recovering from the 40s.',nw:'Sample: new order wins announced'},
TCS:{n:'Tata Consultancy',p:3920,v:3905,t:'l',pat:'Steady earnings, low debt',sc:88,sl:3500,tg:4700,why:'Consistent profit growth, almost no debt, strong cash generation.',nw:'Sample: quarterly results due soon'},
HDFCBANK:{n:'HDFC Bank',p:1725,v:1718,t:'l',pat:'Quality bank, fair valuation',sc:84,sl:1560,tg:2050,why:'Large deposit base, stable margins, valuation near its own average.',nw:'Sample: merger integration on track'},
ASIANPAINT:{n:'Asian Paints',p:2480,v:2466,t:'l',pat:'Market leader, recovering demand',sc:78,sl:2230,tg:2900,why:'Leader in its category with improving volume trend.',nw:'Sample: raw material costs easing'},
TITAN:{n:'Titan Company',p:3410,v:3398,t:'l',pat:'Strong brand, steady growth',sc:76,sl:3050,tg:4000,why:'Steady revenue growth and expanding store network.',nw:'Sample: festive season demand outlook'},
NESTLEIND:{n:'Nestle India',p:2390,v:2384,t:'l',pat:'Defensive, consistent dividends',sc:72,sl:2150,tg:2750,why:'Stable earnings and low volatility; a calmer holding.',nw:'Sample: input costs stable'}};
var S0={cash:28750,hold:[{s:'INFY',q:10,avg:1480,sl:1420,tg:1600},{s:'RELIANCE',q:5,avg:1290,sl:1255,tg:1400}],log:['Paper wallet started with ₹50,000'],cfg:{risk:750,cap:5000,auto:true,pause:false},done:false};
var st=null;try{st=JSON.parse(localStorage.getItem('swingradar')||'null')}catch(e){}
if(!st)st=JSON.parse(JSON.stringify(S0));
var tab='home',left=600,tm=null;
function save(){try{localStorage.setItem('swingradar',JSON.stringify(st))}catch(e){}}
function inr(n){return(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN')}
function pc(n){return(n>=0?'+':'')+n.toFixed(1)+'%'}
function val(){return st.cash+st.hold.reduce(function(a,h){return a+h.q*D[h.s].p},0)}
function today(){return st.hold.reduce(function(a,h){return a+h.q*(D[h.s].p-D[h.s].v)},0)}
function $(i){return document.getElementById(i)}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';setTimeout(function(){t.className=''},2400)}
function log(m){st.log.unshift(m);st.log=st.log.slice(0,6)}
function qtyFor(s){var d=D[s],r=d.p-d.sl,q=Math.floor(st.cfg.risk/r);return Math.max(0,Math.min(q,Math.floor(st.cash/d.p)))}
function buy(s){var d=D[s],q=Math.floor(+($('qty')||{}).value||0),mx=Math.floor(st.cash/d.p);if(q<1){toast('Enter a quantity of at least 1');return}if(q>mx){toast('Not enough cash. Max '+mx+' shares');return}
var h=st.hold.filter(function(x){return x.s===s})[0];
if(h){h.avg=(h.avg*h.q+d.p*q)/(h.q+q);h.q+=q;h.sl=d.sl;h.tg=d.tg}else st.hold.push({s:s,q:q,avg:d.p,sl:d.sl,tg:d.tg});
st.cash-=q*d.p;log('Paper bought '+q+' '+s+' at '+inr(d.p)+', stop '+inr(d.sl));save();closeSheet();toast('Paper trade placed: '+q+' '+s);render()}
function sell(s,how){var i=-1;st.hold.forEach(function(h,k){if(h.s===s)i=k});if(i<0)return;var h=st.hold[i],d=D[s];
st.cash+=h.q*d.p;log((how==='auto'?'Auto-sold ':'Sold ')+h.q+' '+s+' at '+inr(d.p)+' ('+inr((d.p-h.avg)*h.q)+')');st.hold.splice(i,1);
if(s==='INFY')st.done=true;save();closeSheet();toast(how==='auto'?'Protective sell executed':'Sold '+s);render()}
function chart(s,h){var d=D[s],seed=0;for(var i=0;i<s.length;i++)seed+=s.charCodeAt(i);
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
var pts=[d.p],x=d.p;for(i=0;i<44;i++){x=x*(1+(rnd()-.5)*.03+(d.t==='l'?-.002:-.004));pts.unshift(x)}
var ex=[d.p,d.sl||h.sl,d.tg||h.tg],all=pts.concat(ex),mn=Math.min.apply(0,all)*.995,mx=Math.max.apply(0,all)*1.005;
function Y(v){return 8+(1-(v-mn)/(mx-mn))*124}
var line=pts.map(function(v,k){return(k?'L':'M')+(k*320/44).toFixed(1)+' '+Y(v).toFixed(1)}).join('');
function ref(v,c,t){return'<line x1="0" x2="320" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+c+'" stroke-dasharray="4 3" stroke-width="1"/><text x="4" y="'+(Y(v)-3)+'" font-size="10" fill="'+c+'">'+t+' '+inr(v)+'</text>'}
return'<svg viewBox="0 0 320 140" role="img" aria-label="Sample price chart"><path d="'+line+'" fill="none" stroke="var(--ink)" stroke-width="1.6"/>'+ref(d.tg||h.tg,'var(--up)','Target')+ref(d.sl||h.sl,'var(--dn)','Stop')+'</svg>'}
function openIdea(s){var d=D[s],q=qtyFor(s),sh=$('sheet');
sh.innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><div class="row"><h1>'+s+'</h1><span class="pill">Score '+d.sc+'</span></div><div class="mut">'+d.n+' · '+d.pat+'</div>'+chart(s,{})+
'<div class="grid"><div><span class="mut">Entry</span><b>'+inr(d.p)+'</b></div><div><span class="mut">Stop</span><b class="dn">'+inr(d.sl)+'</b></div><div><span class="mut">Target</span><b class="up">'+inr(d.tg)+'</b></div></div>'+
'<div class="card"><b>Why it is here</b><div>'+d.why+'</div><div class="mut" style="margin-top:6px">'+d.nw+'</div></div>'+
'<div class="card"><b>Quantity</b><div class="mut">Suggested: '+q+' shares, sized so a stop hit costs about '+inr(st.cfg.risk)+'</div><div class="row" style="margin:10px 0;justify-content:center"><button class="btn" style="flex:0 0 48px" onclick="stepQ(-1,\''+s+'\')" aria-label="Decrease quantity">-</button><input type="number" id="qty" min="1" value="'+Math.max(1,q)+'" oninput="updQ(\''+s+'\')" style="width:90px;font-size:20px" aria-label="Quantity"><button class="btn" style="flex:0 0 48px" onclick="stepQ(1,\''+s+'\')" aria-label="Increase quantity">+</button></div><div id="qinfo"></div></div>'+
'<div class="btns"><button class="btn" onclick="closeSheet()">Close</button><button class="btn p" onclick="buy(\''+s+'\')">Paper buy</button></div></div></div>';updQ(s)}
function updQ(s){var d=D[s],q=Math.floor(+$('qty').value||0),mx=Math.floor(st.cash/d.p),ls=q*(d.p-d.sl),m='Cost '+inr(q*d.p)+' · Loss if stop hits '+inr(ls)+' · Cash left '+inr(st.cash-q*d.p);if(q>mx)m='<span class="dn">More than your cash allows. Max '+mx+' shares.</span>';else if(ls>st.cfg.risk*1.05)m+='<div class="dn">Above your '+inr(st.cfg.risk)+' risk per trade.</div>';$('qinfo').innerHTML='<div class="mut" style="text-align:center">'+m+'</div>'}
function stepQ(n,s){var i=$('qty');i.value=Math.max(1,(Math.floor(+i.value)||0)+n);updQ(s)}
function openHold(s){var h=st.hold.filter(function(x){return x.s===s})[0],d=D[s],pl=(d.p-h.avg)*h.q,sh=$('sheet');
sh.innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><div class="row"><h1>'+s+'</h1><b class="'+(pl>=0?'up':'dn')+'">'+inr(pl)+'</b></div><div class="mut">'+d.n+' · '+h.q+' shares, avg '+inr(h.avg)+'</div>'+chart(s,h)+
'<div class="grid"><div><span class="mut">Price</span><b>'+inr(d.p)+'</b></div><div><span class="mut">Stop</span><b class="dn">'+inr(h.sl)+'</b></div><div><span class="mut">Target</span><b class="up">'+inr(h.tg)+'</b></div></div>'+
'<div class="btns"><button class="btn" onclick="closeSheet()">Close</button><button class="btn d" onclick="sell(\''+s+'\')">Sell all</button></div></div></div>'}
function openSet(){var c=st.cfg;$('sheet').innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><h1>Settings</h1>'+
'<label class="set">Risk per trade (₹)<input type="number" id="r" min="100" step="50" value="'+c.risk+'"></label>'+
'<label class="set">Total loss limit (₹)<input type="number" id="c" min="500" step="500" value="'+c.cap+'"></label>'+
'<label class="set">Auto-sell when risk is heavy<input type="checkbox" id="a"'+(c.auto?' checked':'')+'></label>'+
'<label class="set">Pause all automation<input type="checkbox" id="p"'+(c.pause?' checked':'')+'></label>'+
'<div class="set mut" style="display:flex;padding:10px 0">Auto-buy is off during paper trading.</div>'+
'<div class="btns"><button class="btn" onclick="if(confirm(\'Reset the paper wallet to ₹50,000?\')){st=JSON.parse(JSON.stringify(S0));save();closeSheet();left=600;render()}">Reset wallet</button><button class="btn p" onclick="saveSet()">Save</button></div></div></div>'}
function saveSet(){var r=+$('r').value,c=+$('c').value;if(!(r>=100)||!(c>=500)){toast('Enter valid amounts');return}st.cfg={risk:r,cap:c,auto:$('a').checked,pause:$('p').checked};save();closeSheet();render()}
function closeSheet(){$('sheet').innerHTML=''}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function ideaCard(s){var d=D[s];return'<button class="card tap" onclick="openIdea(\''+s+'\')"><div class="row"><b>'+s+'</b><span class="pill">Score '+d.sc+'</span></div><div class="mut">'+d.pat+'</div><div class="row" style="margin-top:6px"><span>'+inr(d.p)+'</span><span class="mut">Stop '+inr(d.sl)+' · Target '+inr(d.tg)+'</span></div></button>'}
function home(){var v=val(),t=today(),lost=Math.max(0,50000-v),pct=Math.min(100,lost/st.cfg.cap*100),h='';
h+='<div class="card"><div class="mut">Paper portfolio</div><div class="big">'+inr(v)+'</div><div class="'+(t>=0?'up':'dn')+'">'+inr(t)+' today</div>';
h+='<div class="bar"><i style="width:'+pct+'%;background:'+(pct>70?'var(--dn)':'var(--acc)')+'"></i></div><div class="mut">'+inr(lost)+' of '+inr(st.cfg.cap)+' loss limit used · Cash '+inr(st.cash)+'</div></div>';
var inf=st.hold.filter(function(x){return x.s==='INFY'})[0];
if(inf&&!st.done){var auto=st.cfg.auto&&!st.cfg.pause;h+='<div class="card alert"><b>Action needed: INFY</b><div>Gapped down 5.4% and broke your stop at '+inr(inf.sl)+'. Proposed: sell all '+inf.q+' shares.</div><div class="mut" id="cd">'+(auto?'Auto-sell in '+fmt(left):'Auto-sell is off. Waiting for you.')+'</div>'+
'<div class="btns"><button class="btn" onclick="st.done=true;save();render();toast(\'Holding INFY\')">Hold</button><button class="btn d" onclick="sell(\'INFY\')">Sell now</button></div>'+(auto?'<div class="mut" style="margin-top:8px"><a href="#" onclick="left=5;return false" style="color:var(--acc)">Demo: skip ahead</a></div>':'')+'</div>'}
h+='<h2>Ideas to review</h2>'+['TATASTEEL','TCS'].map(ideaCard).join('')+'<h2>Recent activity</h2><div class="card">'+st.log.map(function(l){return'<div class="mut" style="padding:3px 0">'+l+'</div>'}).join('')+'</div>';return h}
function ideas(){return'<h2 style="margin-top:6px">Top 5 swing trades</h2>'+Object.keys(D).filter(function(k){return D[k].t==='s'}).map(ideaCard).join('')+'<h2>Top 5 long-term</h2>'+Object.keys(D).filter(function(k){return D[k].t==='l'}).map(ideaCard).join('')}
function port(){if(!st.hold.length)return'<div class="card">No holdings yet. Open Ideas and place a paper trade.</div>';return'<h2 style="margin-top:6px">Holdings</h2>'+st.hold.map(function(h){var d=D[h.s],pl=(d.p-h.avg)*h.q;return'<button class="card tap" onclick="openHold(\''+h.s+'\')"><div class="row"><b>'+h.s+'</b><b class="'+(pl>=0?'up':'dn')+'">'+inr(pl)+'</b></div><div class="mut">'+h.q+' shares · avg '+inr(h.avg)+' · now '+inr(d.p)+' ('+pc((d.p/h.avg-1)*100)+')</div><div class="mut">Stop '+inr(h.sl)+' · Target '+inr(h.tg)+'</div></button>'}).join('')}
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function render(){var t={home:'Today',ideas:'Ideas',port:'Portfolio'}[tab];
$('app').innerHTML='<header><h1>'+t+'</h1><button class="ic" onclick="openSet()" aria-label="Settings">Settings</button></header><div class="note">'+(LIVE?'Swing picks are live from your daily scan (last close). '+(LIVEE?'ETFs are live too. ':'')+(LIVEL?'Long-term picks are price-based only (fundamentals not checked). ':'Long-term picks are sample data. ')+'Home market numbers and notifications are still sample data. (Page version 6)':'Prototype with sample data. Prices and picks are not real.')+'</div>'+(tab==='home'?home():tab==='ideas'?ideas():port());
$('nav').innerHTML=[['home','Home'],['ideas','Ideas'],['port','Portfolio']].map(function(x){return'<button class="'+(tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function px(n){return'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
var HI={INFY:{w:['Down about 5% today after a gap down at the open.','It fell below your stop of ₹1,420 and sits under your average buy price.'],u:['Sample: IT stocks sold off on weak global tech spending signals','Sample: investors waiting for management comments on new deals'],f:['It could bounce if the wider IT sector recovers, or slide further if selling continues.']},RELIANCE:{w:['Slightly above your buy price in a steady uptrend with higher lows.'],u:['Sample: retail and telecom units reported steady growth'],f:['Near a past resistance zone around ₹1,350, where it may pause before moving higher.']}};
function port(){if(!st.hold.length)return'<div class="card">No holdings yet. Open Ideas and place a paper trade.</div>';var inv=0,cur=0;st.hold.forEach(function(x){inv+=x.avg*x.q;cur+=D[x.s].p*x.q});var tp=cur-inv;
var h='<div class="card"><div class="row"><div><div class="mut">Invested</div><b>'+inr(inv)+'</b></div><div><div class="mut">Current value</div><b>'+inr(cur)+'</b></div><div style="text-align:right"><div class="mut">Total profit/loss</div><b class="'+(tp>=0?'up':'dn')+'">'+inr(tp)+' ('+pc(tp/inv*100)+')</b></div></div></div><h2>Your stocks</h2>';
return h+st.hold.map(function(x){var d=D[x.s],pl=(d.p-x.avg)*x.q;return'<button class="card tap" onclick="openHold(\''+x.s+'\')"><div class="row"><b>'+x.s+' <span class="mut">'+x.q+' shares</span></b><b class="'+(pl>=0?'up':'dn')+'">'+inr(pl)+' ('+pc((d.p/x.avg-1)*100)+')</b></div><div class="grid"><div><span class="mut">Bought at</span><b>'+px(x.avg)+'</b></div><div><span class="mut">Current</span><b>'+px(d.p)+'</b></div><div><span class="mut">Today</span><b class="'+(d.p>=d.v?'up':'dn')+'">'+pc((d.p/d.v-1)*100)+'</b></div></div></button>'}).join('')}
function openHold(s){var h=st.hold.filter(function(x){return x.s===s})[0];if(!h)return;var d=D[s],pl=(d.p-h.avg)*h.q,up=pl>=0,x=HI[s]||{},
why=x.w||[(up?'Trading above':'Trading below')+' your average buy price of '+px(h.avg)+'.','You bought on: '+d.pat+'.'],
upd=x.u||[d.nw||'Sample: no major news'],
fut=['If it holds above your stop ('+px(h.sl)+'), it could move toward the target ('+px(h.tg)+'): about '+inr((h.tg-h.avg)*h.q)+' gain.','If it falls to the stop, you '+(h.sl>=h.avg?'would still lock in about '+inr((h.sl-h.avg)*h.q):'would lose about '+inr((h.avg-h.sl)*h.q))+'.'].concat(x.f||[]);
function ul(a){return'<ul style="margin:6px 0 0;padding-left:18px">'+a.map(function(t){return'<li>'+t+'</li>'}).join('')+'</ul>'}
$('sheet').innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><div class="row"><h1>'+s+'</h1><b class="'+(up?'up':'dn')+'">'+inr(pl)+' ('+pc((d.p/h.avg-1)*100)+')</b></div><div class="mut">'+d.n+'</div>'+chart(s,h)+

function health(){var k=!!st.kok,f=st.ofail==null?true:st.ofail,inf=st.hold.some(function(x){return x.s==='INFY'});
function row(n,s,ok,b){return'<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span>'+n+'<div class="mut" style="color:'+(ok?'var(--up)':'var(--dn)')+'">'+s+'</div></span>'+(b||'')+'</div>'}
return'<div class="card"><b>System status</b>'+row('Zerodha Kite',k?'Connected':'Login needed',k,k?'':'<button class="btn p" style="flex:0 0 auto;padding:7px 14px" onclick="conn()">Log in</button>')+row('Market data','Sample: live, updated just now',1)+row('Alert delivery','Sample: working',1)+(inf&&f?row('Last order','INFY sell was rejected',0,'<button class="btn d" style="flex:0 0 auto;padding:7px 14px" onclick="retryO()">Retry</button>'):row('Last order','No failed orders',1))+'<div class="mut" style="margin-top:6px">Demo statuses. Real ones appear once the live connection is built.</div></div>'}
tm=setInterval(function(){var inf=st.hold.some(function(x){return x.s==='INFY'});if(!inf||st.done||!st.cfg.auto||st.cfg.pause)return;left--;var c=$('cd');if(c)c.textContent='Auto-sell in '+fmt(Math.max(left,0));if(left<=0){if(st.kok)sell('INFY','auto');else{left=600;st.ofail=true;log('Auto-sell for INFY failed: Zerodha is not connected');NF.unshift({t:'Just now',a:1,f:1,k:'Failed order',m:'Auto-sell for INFY failed because Zerodha is not connected. Nothing was sold. Log in and retry.'});save();toast('Auto-sell failed: not connected to Zerodha');render()}}},1000);
var LIVE=false,LIVEE=false,LIVEL=false,ASOF='';
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function newsHtml(p){var hl=p.headlines||[],o='';if(!hl.length)return'No recent headlines found, so the news score stays neutral.';
o='<b>Recent headlines</b> (simple keyword check, not a full reading)<ul style="margin:6px 0 0;padding-left:18px">'+hl.map(function(x){var u=/^https:\/\//.test(x.link)?x.link:'';return'<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--acc)">'+esc(x.title)+'</a>':esc(x.title))+'</li>'}).join('')+'</ul>';
if((p.flags||[]).length)o='<div class="dn"><b>Watch out:</b> a headline mentions a serious term. Read it before trading.</div>'+o;return o}
function loadLive(){fetch('data/ideas.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
Object.keys(D).forEach(function(k){delete D[k].live});
(j.swing||[]).forEach(function(p){var d=D[p.symbol]||(D[p.symbol]={n:p.symbol,v:p.close});
Object.assign(d,{p:p.close,t:'s',pat:p.pattern,sl:p.stop,tg:p.target,tf:p.timeframe,b:p.parts,sc:p.score,why:p.why+(p.verified?' Prices match BSE data.':''),nw:newsHtml(p),live:1});if(d.v==null)d.v=p.close});
(j.etf||[]).forEach(function(p){var d=D[p.symbol]||(D[p.symbol]={n:p.symbol,v:p.close});Object.assign(d,{p:p.close,t:'e',pat:p.pattern,sl:p.stop,tg:p.target,tf:p.timeframe,b:p.parts,sc:p.score,why:p.why+(p.verified?' Prices match BSE data.':''),nw:'Fund quality score is not connected yet (neutral 50).',live:1});if(d.v==null)d.v=p.close});
(j.long||[]).forEach(function(p){var d=D[p.symbol]||(D[p.symbol]={n:p.symbol,v:p.close});Object.assign(d,{p:p.close,t:'l',pat:p.pattern,sl:p.stop,tg:p.target,tf:p.timeframe,b:p.parts,sc:p.score,why:p.why+(p.verified?' Prices match BSE data.':''),nw:'Price-based list only. Read the company results, profits and debt before buying.',live:1});if(d.v==null)d.v=p.close});
LIVE=true;LIVEE=!!j.etf;LIVEL=!!j.long;ASOF=j.asof;render()}).catch(function(){})}
render();
loadLive();
</script>
</body>
</html>
